<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prospection Locale - Recherche</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="search-page">
      <section class="search-card">
        <h1>Prospection Business Locale</h1>
        <p>Saisis une ville, choisis un type d'activite, puis analyse une fiche a la fois.</p>

        <form id="searchForm" class="search-form">
          <div class="field">
            <label for="city">Ville</label>
            <input id="city" name="city" placeholder="Ex: Marseille" required />
          </div>
          <div class="field">
            <label for="businessType">Type d'activite</label>
            <select id="businessType" name="type" required>
              <option value="restaurant">Restaurant</option>
              <option value="pharmacie">Pharmacie</option>
              <option value="tabac">Tabac</option>
              <option value="coiffeur">Coiffeur</option>
              <option value="hotel">Hotel</option>
              <option value="taxi">Taxi</option>
              <option value="boulangerie">Boulangerie</option>
              <option value="garage">Garage</option>
              <option value="tout">Tout</option>
            </select>
          </div>
          <button type="submit" class="primary-btn">Rechercher</button>
        </form>
      </section>

      <section class="results-wrap">
        <div class="results-head">
          <h2>Resultats</h2>
          <span id="resultCount">0 resultat</span>
        </div>
        <div id="results" class="results-grid"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
