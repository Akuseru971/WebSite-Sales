<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulateur d'optimisation Google Business</title>
    <style>
      :root {
        --bg: #f1f3f4;
        --card: #ffffff;
        --text: #202124;
        --muted: #5f6368;
        --line: #e0e3e7;
        --blue: #1a73e8;
        --green: #188038;
        --shadow: 0 1px 2px rgba(60, 64, 67, 0.16), 0 2px 6px rgba(60, 64, 67, 0.08);
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Google Sans", "Segoe UI", Roboto, Arial, sans-serif;
      }

      .disclaimer {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #fff7e0;
        border-bottom: 1px solid #f0d58b;
        color: #5f4200;
        text-align: center;
        padding: 12px 16px;
        font-weight: 700;
      }

      .layout {
        max-width: 1280px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 20px;
      }

      .card {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--line);
      }

      .form-panel {
        padding: 16px;
        position: sticky;
        top: 70px;
        align-self: start;
      }

      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }

      .hint {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 14px;
      }

      .field {
        margin-bottom: 10px;
      }

      .field label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 5px;
        font-weight: 600;
      }

      .field input,
      .field textarea,
      .field select {
        width: 100%;
        border: 1px solid #cbd1d7;
        border-radius: 10px;
        padding: 9px 10px;
        font: inherit;
        font-size: 14px;
        background: #fff;
      }

      .field textarea {
        min-height: 72px;
        resize: vertical;
      }

      .btn-generate {
        width: 100%;
        margin-top: 6px;
        border: none;
        border-radius: 999px;
        padding: 11px 14px;
        background: var(--blue);
        color: white;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-analyze {
        width: 100%;
        border: 1px solid #dadce0;
        border-radius: 999px;
        padding: 10px 14px;
        background: #fff;
        color: var(--text);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-optimize {
        width: 100%;
        margin-top: 8px;
        border: 1px solid #137333;
        border-radius: 999px;
        padding: 10px 14px;
        background: #e6f4ea;
        color: #137333;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-analyze:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .status {
        min-height: 18px;
        margin: 8px 0 2px;
        font-size: 12px;
        color: var(--muted);
      }

      .status.error {
        color: #b3261e;
      }

      .status.success {
        color: #137333;
      }

      .search-box {
        margin-bottom: 12px;
        padding: 10px;
        border: 1px solid #dfe3e8;
        border-radius: 12px;
        background: #f8f9fa;
      }

      .btn-search {
        width: 100%;
        border: none;
        border-radius: 999px;
        background: var(--blue);
        color: #fff;
        font-weight: 700;
        padding: 10px 12px;
        cursor: pointer;
      }

      .filter-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
      }

      .weak-badge {
        display: inline-block;
        margin-top: 4px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
      }

      .weak-high {
        background: #fce8e6;
        color: #b3261e;
        border: 1px solid #f2b8b5;
      }

      .weak-mid {
        background: #fff8e8;
        color: #8a4f00;
        border: 1px solid #f0d58b;
      }

      .weak-low {
        background: #e6f4ea;
        color: #137333;
        border: 1px solid #b7dfc3;
      }

      .results-list {
        display: grid;
        gap: 8px;
        margin-bottom: 12px;
        max-height: 230px;
        overflow: auto;
      }

      .result-card {
        border: 1px solid #dfe3e8;
        border-radius: 10px;
        padding: 8px;
        background: #fff;
      }

      .result-card h4 {
        margin: 0 0 4px;
        font-size: 14px;
      }

      .result-card p {
        margin: 0 0 4px;
        font-size: 12px;
        color: var(--muted);
      }

      .small-btn {
        border: 1px solid #dadce0;
        background: #fff;
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .analysis-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .current-card,
      .gap-card {
        border: 1px solid #e3e7eb;
        border-radius: 10px;
        padding: 10px;
        background: #fff;
      }

      .current-photo {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #d8dde3;
        margin-bottom: 8px;
      }

      .map-frame {
        width: 100%;
        height: 180px;
        border: 1px solid #d8dde3;
        border-radius: 8px;
        margin-top: 8px;
      }

      .gap-list {
        margin: 0;
        padding-left: 18px;
        color: #3c4043;
        line-height: 1.5;
      }

      .open-google {
        display: inline-block;
        margin-top: 8px;
        padding: 7px 11px;
        border-radius: 999px;
        border: 1px solid #dadce0;
        text-decoration: none;
        color: #1f1f1f;
        font-weight: 700;
        font-size: 12px;
      }

      .compare-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .compare-card {
        border: 1px solid #e3e7eb;
        border-radius: 10px;
        padding: 10px;
        background: #fff;
      }

      .compare-title {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
        font-weight: 700;
      }

      .compare-value {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 4px;
      }

      .delta-up {
        color: #137333;
        font-weight: 700;
      }

      .delta-neutral {
        color: #5f6368;
        font-weight: 700;
      }

      .opt-badge {
        display: inline-block;
        margin-top: 8px;
        font-size: 12px;
        font-weight: 700;
        color: #137333;
        background: #e6f4ea;
        border: 1px solid #b7dfc3;
        border-radius: 999px;
        padding: 4px 10px;
      }

      .profile-compare-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .profile-version-card {
        border: 1px solid #e3e7eb;
        border-radius: 12px;
        padding: 10px;
        background: #fff;
      }

      .profile-version-card h4 {
        margin: 0;
        font-size: 16px;
      }

      .version-tag {
        display: inline-block;
        margin-bottom: 8px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
      }

      .version-current {
        background: #f1f3f4;
        color: #3c4043;
      }

      .version-optimized {
        background: #e6f4ea;
        color: #137333;
      }

      .version-meta {
        margin: 6px 0;
        font-size: 12px;
        color: var(--muted);
      }

      .version-desc {
        margin: 8px 0;
        font-size: 13px;
        line-height: 1.5;
        color: #3c4043;
      }

      .version-list {
        margin: 0;
        padding-left: 18px;
        font-size: 12px;
        color: #3c4043;
        line-height: 1.5;
      }

      .preview {
        padding: 16px;
      }

      .panel {
        max-width: 840px;
        margin: 0 auto;
        overflow: hidden;
      }

      .top-header {
        padding: 18px;
        border-bottom: 1px solid var(--line);
      }

      .biz-name {
        font-size: 28px;
        font-weight: 700;
        margin: 0;
      }

      .biz-cat {
        color: var(--muted);
        margin-top: 2px;
        font-size: 15px;
      }

      .rating-row {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .stars {
        color: #fbbc04;
        letter-spacing: 1px;
        font-size: 17px;
      }

      .meta-line {
        color: var(--muted);
        font-size: 14px;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      .g-btn {
        border: 1px solid #d2d8de;
        background: #fff;
        color: #1f1f1f;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        padding: 0 14px;
      }

      .tab {
        border: none;
        background: transparent;
        padding: 12px 10px;
        color: var(--muted);
        font-weight: 700;
        cursor: pointer;
        border-bottom: 3px solid transparent;
      }

      .tab.active {
        color: var(--blue);
        border-color: var(--blue);
      }

      .section {
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }

      .section h3 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .gallery img {
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        border-radius: 10px;
        border: 1px solid var(--line);
      }

      .service-list,
      .faq-list,
      .review-list,
      .menu-list {
        display: grid;
        gap: 10px;
      }

      .item {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        background: #fff;
      }

      .check {
        color: var(--green);
        font-weight: 700;
        margin-right: 8px;
      }

      .review-author {
        font-weight: 700;
      }

      .response {
        margin-top: 8px;
        padding-left: 10px;
        border-left: 3px solid #d8e6fb;
        color: #30435d;
        font-size: 13px;
      }

      .rating-breakdown {
        display: grid;
        gap: 7px;
      }

      .bar-row {
        display: grid;
        grid-template-columns: 22px 1fr 28px;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }

      .bar {
        height: 8px;
        border-radius: 999px;
        background: #ecf0f4;
        overflow: hidden;
      }

      .bar > span {
        display: block;
        height: 100%;
        background: var(--blue);
      }

      .audit {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .score-box {
        border-radius: 12px;
        border: 1px solid var(--line);
        padding: 12px;
        background: #fff;
      }

      .score-label {
        color: var(--muted);
        font-size: 12px;
      }

      .score-value {
        font-size: 28px;
        font-weight: 800;
        margin-top: 2px;
      }

      .cta-wrap {
        padding: 18px;
        text-align: center;
      }

      .bottom-cta {
        display: inline-block;
        background: var(--blue);
        color: #fff;
        text-decoration: none;
        border-radius: 999px;
        font-weight: 700;
        padding: 12px 20px;
      }

      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .form-panel {
          position: static;
        }

        .analysis-grid {
          grid-template-columns: 1fr;
        }

        .compare-grid {
          grid-template-columns: 1fr;
        }

        .profile-compare-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="disclaimer">Simulation d’optimisation Google Business – Aperçu marketing – non affilié à Google</div>

    <div class="layout">
      <aside class="card form-panel">
        <h1>Simulateur Google Business</h1>
        <p class="hint">Etape 1: recherche des lieux par ville. Etape 2: Analyser un lieu.</p>

        <div class="search-box">
          <div class="field"><label>Ville</label><input id="searchCity" placeholder="Marseille" /></div>
          <div class="field">
            <label>Type de commerce</label>
            <select id="searchType">
              <option value="restaurant">Restaurant</option>
              <option value="pharmacie">Pharmacie</option>
              <option value="tabac">Tabac</option>
              <option value="coiffeur">Coiffeur</option>
              <option value="hotel">Hotel</option>
              <option value="taxi">Taxi</option>
              <option value="boulangerie">Boulangerie</option>
              <option value="garage">Garage</option>
              <option value="tout">Tout</option>
            </select>
          </div>
          <div class="filter-row">
            <div class="field" style="margin:0">
              <label>Filtre faiblesses</label>
              <select id="weaknessFilter">
                <option value="all">Tous</option>
                <option value="weak">Faibles uniquement</option>
                <option value="very-weak">Tres faibles uniquement</option>
              </select>
            </div>
            <div class="field" style="margin:0">
              <label>Tri</label>
              <select id="sortMode">
                <option value="weakness">Priorite faiblesses</option>
                <option value="rating">Meilleure note</option>
                <option value="reviews">Plus d'avis</option>
              </select>
            </div>
          </div>
          <button class="btn-search" id="searchBtn" type="button">Rechercher</button>
          <div class="status" id="searchStatus">Saisis une ville puis clique sur Rechercher.</div>
        </div>

        <div class="results-list" id="searchResults"></div>

        <div class="field"><label>Business name</label><input id="businessName" value="Le Jardin Gourmand" /></div>
        <div class="field"><label>Category</label><input id="category" value="Restaurant" /></div>
        <div class="field"><label>City</label><input id="city" value="Lyon" /></div>
        <div class="field"><label>Rating</label><input id="rating" type="number" min="1" max="5" step="0.1" value="4.6" /></div>
        <div class="field"><label>Review count</label><input id="reviewCount" type="number" value="328" /></div>
        <div class="field"><label>Address</label><input id="address" value="14 Rue Victor Hugo, 69002 Lyon" /></div>
        <div class="field"><label>Phone</label><input id="phone" value="04 78 00 00 00" /></div>
        <div class="field"><label>Website</label><input id="website" value="https://example.com" /></div>
        <div class="field"><label>Description</label><textarea id="description">Cuisine maison de saison, produits locaux et ambiance chaleureuse en centre-ville.</textarea></div>
        <div class="field"><label>Services (un par ligne)</label><textarea id="services">Déjeuner sur place
Dîner
Vente à emporter
Options végétariennes
Réservation en ligne</textarea></div>
        <div class="field"><label>FAQ (une question par ligne, format: Question|Réponse)</label><textarea id="faq">Avez-vous des options végétariennes ?|Oui, plusieurs plats sont disponibles chaque jour.
Acceptez-vous les groupes ?|Oui, sur réservation préalable.
Y a-t-il une terrasse ?|Oui, terrasse disponible aux beaux jours.</textarea></div>
        <div class="field"><label>Images (6 URLs, une par ligne)</label><textarea id="images">https://images.unsplash.com/photo-1517248135467-4c7edcad34c4
https://images.unsplash.com/photo-1559339352-11d035aa65de
https://images.unsplash.com/photo-1555396273-367ea4eb4db5
https://images.unsplash.com/photo-1552566626-52f8b828add9
https://images.unsplash.com/photo-1551218808-94e220e084d2
https://images.unsplash.com/photo-1414235077428-338989a2e8c0</textarea></div>

        <button class="btn-generate" id="generateBtn">Generate Page</button>
        <button class="btn-optimize" id="optimizeBtn" type="button">Generer version optimisee + comparatif</button>
      </aside>

      <section class="preview">
        <div class="card panel" id="previewPanel"></div>
      </section>
    </div>

    <script>
      function getLines(id) {
        return document.getElementById(id).value
          .split("\n")
          .map((v) => v.trim())
          .filter(Boolean);
      }

      function escapeHtml(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function stars(rating) {
        const full = Math.floor(rating);
        const half = rating - full >= 0.5 ? 1 : 0;
        const empty = 5 - full - half;
        return "★".repeat(full) + (half ? "☆" : "") + "☆".repeat(empty);
      }

      function setValue(id, value) {
        const input = document.getElementById(id);
        if (!input || !value) return;
        input.value = String(value).trim();
      }

      function setTextLines(id, lines) {
        if (!Array.isArray(lines) || lines.length === 0) return;
        const input = document.getElementById(id);
        if (!input) return;
        input.value = lines
          .map((line) => String(line || "").trim())
          .filter(Boolean)
          .join("\n");
      }

      function applyExtractedData(extracted) {
        if (!extracted) return;

        setValue("businessName", extracted.businessName);
        setValue("category", extracted.category);
        setValue("city", extracted.city);
        setValue("address", extracted.address);
        setValue("phone", extracted.phone);
        setValue("website", extracted.website);
        setValue("description", extracted.description);

        setTextLines("services", extracted.services);
        setTextLines("faq", extracted.faq);
        setTextLines("images", extracted.images);
      }

      function applyBusinessSelection(business) {
        if (!business) return;

        selectedBusinessContext = business;

        const baselineServices = [
          "Information de base disponible",
          business.phone ? "Contact telephonique affiche" : "Contact telephonique incomplet",
          business.website ? "Lien site web disponible" : "Lien site web manquant"
        ];

        const baselineFaq = [
          { q: "Quels sont les horaires ?", a: "Horaires a confirmer selon Google et le site." },
          { q: "Comment contacter l'etablissement ?", a: business.phone || "Telephone non renseigne pour le moment." }
        ];

        selectedTargetProfile = {
          businessName: business.name || "Business",
          category: business.category || "local_business",
          city: business.city || "",
          rating: Math.max(1, Math.min(5, Number(business.rating || 4))),
          reviewCount: Math.max(0, Number(business.reviewCount || 0)),
          address: business.address || "Adresse non disponible",
          phone: business.phone || "Telephone a completer",
          website: business.website || "#",
          description: `${business.name || "Cet etablissement"} est present sur Google avec une fiche active. Cette version reprend l'etat actuel de la fiche ciblee avant optimisation.`,
          services: baselineServices,
          faqPairs: baselineFaq
        };

        setValue("businessName", business.name);
        setValue("category", business.category);
        setValue("city", business.city);
        setValue("address", business.address);
        setValue("phone", business.phone || "Telephone a completer");
        setValue("website", business.website || "#");

        if (Array.isArray(business.photos) && business.photos.length) {
          setTextLines("images", business.photos.slice(0, 6));
        }

        const generatedDescription = `${business.name} est une adresse locale a ${business.city}, reconnue pour la qualite de son service et une experience client rassurante. Cette simulation met en avant les elements qui renforcent la visibilite Google et la conversion.`;
        setValue("description", generatedDescription);

        setTextLines("services", [
          "Prise de contact rapide",
          "Service client personalise",
          "Informations claires et a jour"
        ]);

        setTextLines("faq", [
          "Quels sont les horaires ?|Horaires a confirmer selon la periode.",
          "Comment reserver ?|Par telephone ou via le site web."
        ]);

        generate();
      }

      function businessCardHtml(business) {
        const weaknessClass = business.weaknessScore >= 55
          ? "weak-high"
          : business.weaknessScore >= 35
            ? "weak-mid"
            : "weak-low";

        return `
          <div class="result-card">
            <h4>${escapeHtml(business.name || "Business")}</h4>
            <p>${escapeHtml(business.category || "local_business")} · ${escapeHtml(business.city || "")}</p>
            <p>${escapeHtml(business.address || "Adresse non disponible")}</p>
            <p>Note: ${Number(business.rating || 0).toFixed(1)} (${business.reviewCount || 0} avis)</p>
            <span class="weak-badge ${weaknessClass}">Faiblesse: ${business.weaknessScore}/100</span>
            ${business.photoUrl ? `<img class="current-photo" src="${escapeHtml(business.photoUrl)}" alt="${escapeHtml(business.name || "Business")}" />` : ""}
            ${business.mapsUrl ? `<a class="open-google" href="${escapeHtml(business.mapsUrl)}" target="_blank">Voir la fiche Google</a>` : ""}
            <button class="small-btn pick-btn" data-id="${escapeHtml(business.id || "")}">Analyser</button>
          </div>
        `;
      }

      function enrichWithWeaknessScore(business) {
        const rating = Number(business.rating || 0);
        const reviewCount = Number(business.reviewCount || 0);
        const photoCount = Array.isArray(business.photos) ? business.photos.length : 0;
        const hasWebsite = !!business.website;
        const hasPhone = !!business.phone;

        let score = 0;
        if (rating < 3.8) score += 35;
        else if (rating < 4.2) score += 24;
        else if (rating < 4.5) score += 12;

        if (reviewCount < 20) score += 25;
        else if (reviewCount < 80) score += 14;
        else if (reviewCount < 150) score += 6;

        if (photoCount < 3) score += 18;
        else if (photoCount < 6) score += 8;

        if (!hasWebsite) score += 14;
        if (!hasPhone) score += 8;

        return {
          ...business,
          weaknessScore: Math.max(0, Math.min(100, score))
        };
      }

      let lastSearchBusinesses = [];
      let selectedBusinessContext = null;
      let selectedTargetProfile = null;
      let optimizationMode = false;

      function computeAuditScore(rating, reviewCount, servicesCount, faqCount) {
        return Math.max(45, Math.round((rating * 20 + Math.min(30, servicesCount * 4) + Math.min(20, faqCount * 3)) / 1.1));
      }

      function optimizeProfile(base) {
        const boostedRating = Math.min(5, base.rating + 0.2);
        const boostedReviews = base.reviewCount + Math.max(12, Math.round(base.reviewCount * 0.18));

        const optimizedDescription = `${base.businessName} renforce sa presence locale avec une fiche claire, orientee conversion et preuve sociale. L'information est structuree pour repondre rapidement aux attentes des clients et augmenter les demandes entrantes.`;

        const optimizedServices = Array.from(new Set([
          ...base.services,
          "Reponse rapide aux demandes",
          "Mise a jour hebdomadaire des informations",
          "Parcours client simplifie"
        ])).slice(0, 8);

        const optimizedFaqPairs = [
          ...base.faqPairs,
          { q: "Quels services sont les plus demandes ?", a: "Les services prioritaires sont mis en avant pour simplifier le choix des clients." },
          { q: "Comment obtenir une reponse rapide ?", a: "Un canal de contact direct est affiche en tete de fiche." }
        ].slice(0, 6);

        return {
          ...base,
          rating: boostedRating,
          reviewCount: boostedReviews,
          description: optimizedDescription,
          services: optimizedServices,
          faqPairs: optimizedFaqPairs
        };
      }

      function renderProfileVersionCard(profile, version) {
        const isOptimized = version === "optimized";
        const tagClass = isOptimized ? "version-optimized" : "version-current";
        const tagLabel = isOptimized ? "Version optimisee" : "Version actuelle";
        const topServices = (profile.services || []).slice(0, 3);

        return `
          <div class="profile-version-card">
            <span class="version-tag ${tagClass}">${tagLabel}</span>
            <h4>${escapeHtml(profile.businessName)}</h4>
            <div class="version-meta">${escapeHtml(profile.category)} · ${escapeHtml(profile.city)}</div>
            <div class="version-meta">Note: ${Number(profile.rating || 0).toFixed(1)} · ${profile.reviewCount || 0} avis</div>
            <div class="version-meta">${escapeHtml(profile.address || "Adresse non disponible")}</div>
            <div class="version-desc">${escapeHtml(profile.description || "Description indisponible")}</div>
            <ul class="version-list">
              ${topServices.map((service) => `<li>${escapeHtml(service)}</li>`).join("")}
            </ul>
          </div>
        `;
      }

      async function searchBusinessesByCity() {
        const city = document.getElementById("searchCity").value.trim();
        const type = document.getElementById("searchType").value;
        const weaknessFilter = document.getElementById("weaknessFilter").value;
        const sortMode = document.getElementById("sortMode").value;
        const status = document.getElementById("searchStatus");
        const resultsEl = document.getElementById("searchResults");

        if (!city) {
          status.textContent = "Merci de saisir une ville.";
          status.className = "status error";
          resultsEl.innerHTML = "";
          return;
        }

        status.textContent = "Recherche en cours...";
        status.className = "status";
        resultsEl.innerHTML = "";

        try {
          const response = await fetch(`/api/search?city=${encodeURIComponent(city)}&type=${encodeURIComponent(type)}`);
          const payload = await response.json();

          if (!response.ok) {
            throw new Error(payload && payload.error ? payload.error : "Recherche impossible");
          }

          lastSearchBusinesses = Array.isArray(payload.businesses)
            ? payload.businesses.map(enrichWithWeaknessScore)
            : [];

          let visibleBusinesses = [...lastSearchBusinesses];

          if (weaknessFilter === "weak") {
            visibleBusinesses = visibleBusinesses.filter((item) => item.weaknessScore >= 35);
          }

          if (weaknessFilter === "very-weak") {
            visibleBusinesses = visibleBusinesses.filter((item) => item.weaknessScore >= 55);
          }

          if (sortMode === "weakness") {
            visibleBusinesses.sort((a, b) => b.weaknessScore - a.weaknessScore);
          } else if (sortMode === "rating") {
            visibleBusinesses.sort((a, b) => Number(b.rating || 0) - Number(a.rating || 0));
          } else if (sortMode === "reviews") {
            visibleBusinesses.sort((a, b) => Number(b.reviewCount || 0) - Number(a.reviewCount || 0));
          }

          if (!visibleBusinesses.length) {
            status.textContent = "Aucun lieu trouve pour cette recherche.";
            status.className = "status error";
            resultsEl.innerHTML = "";
            return;
          }

          resultsEl.innerHTML = visibleBusinesses.map(businessCardHtml).join("");
          status.textContent = `${visibleBusinesses.length} lieu(x) affiche(s) sur ${lastSearchBusinesses.length} trouve(s).`;
          status.className = "status success";

          document.querySelectorAll(".pick-btn").forEach((button) => {
            button.addEventListener("click", () => {
              const id = button.getAttribute("data-id");
              const found = lastSearchBusinesses.find((item) => item.id === id);
              applyBusinessSelection(found);
            });
          });
        } catch (error) {
          status.textContent = `Erreur: ${error instanceof Error ? error.message : "Recherche impossible."}`;
          status.className = "status error";
          resultsEl.innerHTML = "";
        }
      }

      function buildRatingBreakdown(rating, reviewCount) {
        const base = Math.max(1, reviewCount);
        const five = Math.round(base * Math.min(0.72, rating / 5));
        const four = Math.round(base * 0.17);
        const three = Math.round(base * 0.07);
        const two = Math.round(base * 0.03);
        const one = Math.max(0, base - five - four - three - two);
        return [
          { star: 5, count: five },
          { star: 4, count: four },
          { star: 3, count: three },
          { star: 2, count: two },
          { star: 1, count: one }
        ];
      }

      function generate() {
        const formProfile = {
          businessName: document.getElementById("businessName").value.trim() || "Business Name",
          category: document.getElementById("category").value.trim() || "Category",
          city: document.getElementById("city").value.trim() || "City",
          rating: Math.max(1, Math.min(5, Number(document.getElementById("rating").value || 4.5))),
          reviewCount: Math.max(0, Number(document.getElementById("reviewCount").value || 0)),
          address: document.getElementById("address").value.trim() || "Adresse à compléter",
          phone: document.getElementById("phone").value.trim() || "Téléphone à compléter",
          website: document.getElementById("website").value.trim() || "#",
          description: document.getElementById("description").value.trim() || "Description à compléter.",
          services: getLines("services"),
          faqPairs: getLines("faq").map((line) => {
          const [q, a] = line.split("|");
          return { q: q ? q.trim() : "Question", a: a ? a.trim() : "Réponse à compléter" };
          })
        };

        const currentProfile = selectedTargetProfile || formProfile;
        const optimizedProfile = optimizeProfile(currentProfile);
        const displayProfile = optimizationMode ? optimizedProfile : currentProfile;

        const businessName = displayProfile.businessName;
        const category = displayProfile.category;
        const city = displayProfile.city;
        const rating = displayProfile.rating;
        const reviewCount = displayProfile.reviewCount;
        const address = displayProfile.address;
        const phone = displayProfile.phone;
        const website = displayProfile.website;
        const description = displayProfile.description;

        const services = displayProfile.services;
        const faqPairs = displayProfile.faqPairs;

        const inputImages = getLines("images");
        const fallback = [
          "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4",
          "https://images.unsplash.com/photo-1559339352-11d035aa65de",
          "https://images.unsplash.com/photo-1555396273-367ea4eb4db5",
          "https://images.unsplash.com/photo-1552566626-52f8b828add9",
          "https://images.unsplash.com/photo-1551218808-94e220e084d2",
          "https://images.unsplash.com/photo-1414235077428-338989a2e8c0"
        ];
        const images = [...inputImages, ...fallback].slice(0, 6);

        const reviews = [
          { author: "Camille R.", score: 5, text: "Service rapide et ambiance très agréable.", response: "Merci Camille, ravi que l'ambiance vous ait plu." },
          { author: "Karim D.", score: 4, text: "Très bon rapport qualité/prix.", response: "Merci Karim, au plaisir de vous revoir bientôt." },
          { author: "Sophie M.", score: 5, text: "Excellente expérience globale.", response: "Merci Sophie pour votre retour, à très vite." }
        ];

        const bars = buildRatingBreakdown(rating, reviewCount);
        const maxBar = Math.max(...bars.map((b) => b.count), 1);

        const currentScore = computeAuditScore(currentProfile.rating, currentProfile.reviewCount, currentProfile.services.length, currentProfile.faqPairs.length);
        const optimizedScore = Math.min(100, currentScore + 12);
        const displayedScore = optimizationMode
          ? computeAuditScore(rating, reviewCount, services.length, faqPairs.length)
          : currentScore;

        const imageCount = images.length;
        const hasWebsite = website && website !== "#";
        const hasPhone = !!phone && !/a completer/i.test(phone);
        const gaps = [];
        if (imageCount < 4) gaps.push("Ajouter plus de photos professionnelles pour rassurer et convertir.");
        if (!hasWebsite) gaps.push("Ajouter un site web pour capter le trafic et les demandes entrantes.");
        if (!hasPhone) gaps.push("Completer le numero de telephone pour augmenter les appels.");
        if (reviewCount < 50) gaps.push("Encourager plus d'avis clients pour renforcer la preuve sociale.");
        if (rating < 4.3) gaps.push("Mettre en place un plan qualite pour relever la note moyenne.");
        if (!gaps.length) gaps.push("La fiche est deja solide. Focus sur frequences de publication et avis recents.");

        const mapsUrl = selectedBusinessContext && selectedBusinessContext.mapsUrl
          ? selectedBusinessContext.mapsUrl
          : `https://www.google.com/maps/search/${encodeURIComponent(address)}`;

        const panel = document.getElementById("previewPanel");
        panel.innerHTML = `
          <div class="top-header">
            <h2 class="biz-name">${escapeHtml(businessName)}</h2>
            <div class="biz-cat">${escapeHtml(category)} · ${escapeHtml(city)}</div>
            <div class="rating-row">
              <div class="stars">${stars(rating)}</div>
              <div class="meta-line">${rating.toFixed(1)} · ${reviewCount} avis</div>
            </div>
            <div class="meta-line" style="margin-top:6px">${escapeHtml(address)} · ${escapeHtml(phone)}</div>
            <div class="actions">
              <a class="g-btn" href="tel:${escapeHtml(phone)}">Call</a>
              <a class="g-btn" href="https://www.google.com/maps/search/${encodeURIComponent(address)}" target="_blank">Directions</a>
              <a class="g-btn" href="${escapeHtml(website)}" target="_blank">Website</a>
              <a class="g-btn" href="#">Reserve</a>
            </div>
            ${optimizationMode ? '<span class="opt-badge">Version optimisee active</span>' : ''}
          </div>

          ${optimizationMode ? `
          <div class="section">
            <h3>Comparatif fiche actuelle vs optimisation</h3>
            <div class="compare-grid">
              <div class="compare-card">
                <div class="compare-title">Fiche actuelle</div>
                <div class="compare-value">${currentProfile.rating.toFixed(1)} · ${currentProfile.reviewCount} avis</div>
                <div class="delta-neutral">Score: ${currentScore}</div>
                <div class="meta-line" style="margin-top:6px">Services: ${currentProfile.services.length} · FAQ: ${currentProfile.faqPairs.length}</div>
              </div>
              <div class="compare-card">
                <div class="compare-title">Version optimisee</div>
                <div class="compare-value">${rating.toFixed(1)} · ${reviewCount} avis</div>
                <div class="delta-up">Score: ${displayedScore} ( +${displayedScore - currentScore} )</div>
                <div class="meta-line" style="margin-top:6px">Services: ${services.length} · FAQ: ${faqPairs.length}</div>
              </div>
            </div>
          </div>
          ` : ""}

          <div class="section">
            <h3>Fiche ciblee reprise et version amelioree</h3>
            <div class="profile-compare-grid">
              ${renderProfileVersionCard(currentProfile, "current")}
              ${renderProfileVersionCard(optimizedProfile, "optimized")}
            </div>
          </div>

          <div class="tabs">
            <button class="tab active">Présentation</button>
            <button class="tab">Avis</button>
            <button class="tab">Photos</button>
            <button class="tab">Menu</button>
          </div>

          <div class="section">
            <h3>Fiche Google actuelle et analyse</h3>
            <div class="analysis-grid">
              <div class="current-card">
                <div style="font-weight:700;margin-bottom:6px">Visuel actuel</div>
                ${images[0] ? `<img class="current-photo" src="${escapeHtml(images[0])}" alt="Photo actuelle" />` : ""}
                <div class="meta-line">${escapeHtml(address)}</div>
                <div class="meta-line">Note actuelle: ${rating.toFixed(1)} · ${reviewCount} avis</div>
                <a class="open-google" href="${escapeHtml(mapsUrl)}" target="_blank">Ouvrir la fiche Google actuelle</a>
                <iframe
                  class="map-frame"
                  loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                  src="https://www.google.com/maps?q=${encodeURIComponent(address)}&output=embed"
                ></iframe>
              </div>
              <div class="gap-card">
                <div style="font-weight:700;margin-bottom:6px">Analyse des ecarts</div>
                <ul class="gap-list">
                  ${gaps.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
                </ul>
              </div>
            </div>
          </div>

          <div class="section">
            <h3>Photos</h3>
            <div class="gallery">
              ${images.map((src, i) => `<img src="${escapeHtml(src)}?auto=format&fit=crop&w=900&q=80" alt="Photo ${i + 1}" />`).join("")}
            </div>
          </div>

          <div class="section">
            <h3>Description</h3>
            <p style="margin:0;color:#3c4043;line-height:1.6">${escapeHtml(description)}</p>
          </div>

          <div class="section">
            <h3>Services</h3>
            <div class="service-list">
              ${(services.length ? services : ["Service à compléter"]).map((s) => `<div class="item"><span class="check">✓</span>${escapeHtml(s)}</div>`).join("")}
            </div>
          </div>

          <div class="section">
            <h3>FAQ</h3>
            <div class="faq-list">
              ${(faqPairs.length ? faqPairs : [{ q: "Question à compléter", a: "Réponse à compléter" }]).map((f) => `<div class="item"><strong>${escapeHtml(f.q)}</strong><div style="margin-top:5px;color:#3c4043">${escapeHtml(f.a)}</div></div>`).join("")}
            </div>
          </div>

          <div class="section">
            <h3>Avis et réponses</h3>
            <div class="review-list">
              ${reviews.map((r) => `
                <div class="item">
                  <div class="review-author">${escapeHtml(r.author)} · ${"★".repeat(r.score)}</div>
                  <div style="margin-top:4px;color:#3c4043">${escapeHtml(r.text)}</div>
                  <div class="response"><strong>Réponse du propriétaire:</strong> ${escapeHtml(r.response)}</div>
                </div>
              `).join("")}
            </div>
          </div>

          <div class="section">
            <h3>Répartition des notes</h3>
            <div class="rating-breakdown">
              ${bars.map((b) => `
                <div class="bar-row">
                  <span>${b.star}</span>
                  <div class="bar"><span style="width:${Math.round((b.count / maxBar) * 100)}%"></span></div>
                  <span>${b.count}</span>
                </div>
              `).join("")}
            </div>
          </div>

          <div class="section">
            <h3>Audit Score</h3>
            <div class="audit">
              <div class="score-box">
                <div class="score-label">Current score</div>
                <div class="score-value">${displayedScore}</div>
              </div>
              <div class="score-box">
                <div class="score-label">Potential optimized score</div>
                <div class="score-value" style="color:#188038">${optimizedScore}</div>
              </div>
            </div>
          </div>

          <div class="cta-wrap">
            <a class="bottom-cta" href="#">Optimiser ma fiche Google</a>
          </div>
        `;
      }

      document.getElementById("searchBtn").addEventListener("click", searchBusinessesByCity);
      document.getElementById("generateBtn").addEventListener("click", () => {
        optimizationMode = false;
        generate();
      });
      document.getElementById("optimizeBtn").addEventListener("click", () => {
        optimizationMode = true;
        generate();
      });
      generate();
    </script>
  </body>
</html>
